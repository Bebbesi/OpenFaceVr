<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#000000" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Open Face VR — coming soon." />
<meta property="og:title" content="Open Face VR" />
<meta property="og:description" content="Coming soon." />
<meta property="og:type" content="website" />
<title>Open Face VR — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --fg-dim: #8c8c8c;
    --hairline: rgba(255, 255, 255, 0.25);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Jost', 'Century Gothic', 'Futura', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 1.5rem;
    opacity: 0;
    animation: reveal-body 0.8s ease forwards;
  }

  @keyframes reveal-body {
    to { opacity: 1; }
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .stage {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .row {
    font-weight: 300;
    font-size: clamp(2.75rem, 9vw, 5.75rem);
    line-height: 1.12;
    letter-spacing: 0.01em;
    white-space: nowrap;
    min-height: 1.12em;
  }

  .cursor {
    display: none;
    width: 0.06em;
    height: 0.78em;
    margin-left: 0.14em;
    background: var(--fg);
    vertical-align: baseline;
    animation: blink 0.9s steps(1, start) infinite;
  }

  .cursor.on {
    display: inline-block;
  }

  .cursor.done {
    animation: none;
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .divider {
    width: 0;
    height: 1px;
    background: var(--hairline);
    margin: clamp(1.5rem, 4vw, 2.25rem) 0 clamp(1rem, 3vw, 1.35rem);
    transition: width 0.55s cubic-bezier(0.65, 0, 0.35, 1);
  }

  .divider.show {
    width: clamp(56px, 10vw, 96px);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 0.6em;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .status.show {
    opacity: 1;
    transform: translateY(0);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--fg-dim);
    flex-shrink: 0;
  }

  .status.show .status-dot {
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { background: var(--fg-dim); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    50% { background: var(--fg); box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.5); }
  }

  .status-label {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-weight: 400;
    font-size: clamp(0.65rem, 1.5vw, 0.8rem);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }

  @media (prefers-reduced-motion: reduce) {
    body { animation: none; opacity: 1; }
    .cursor { animation: none; }
    .status.show .status-dot { animation: none; background: var(--fg); }
    .divider, .status { transition: none; }
  }
</style>
</head>
<body>

<h1 class="sr-only">Open Face VR — Coming soon</h1>

<div class="stage js-only" id="stage" aria-hidden="true">
  <div class="row" id="row-0"><span class="text" id="text-0"></span></div>
  <div class="row" id="row-1"><span class="text" id="text-1"></span></div>
  <div class="row" id="row-2"><span class="text" id="text-2"></span></div>
  <div class="divider" id="divider"></div>
  <div class="status" id="status">
    <span class="status-dot"></span>
    <span class="status-label">Coming soon</span>
  </div>
</div>

<span class="cursor" id="cursor"></span>

<noscript>
  <style>.js-only { display: none; }</style>
  <div class="stage">
    <div class="row">OPEN</div>
    <div class="row">FACE</div>
    <div class="row">VR</div>
    <div class="divider show" style="width: 72px;"></div>
    <div class="status show" style="opacity: 1; transform: none;">
      <span class="status-dot" style="background: #ffffff;"></span>
      <span class="status-label">Coming soon</span>
    </div>
  </div>
</noscript>

<script>
(function () {
  var words = ['OPEN', 'FACE', 'VR'];
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var typingSpeed = 85;
  var linePause = 150;
  var startDelay = 400;

  var cursorEl = document.getElementById('cursor');
  var dividerEl = document.getElementById('divider');
  var statusEl = document.getElementById('status');

  function revealInstantly() {
    words.forEach(function (word, i) {
      document.getElementById('text-' + i).textContent = word;
    });
    dividerEl.classList.add('show');
    statusEl.classList.add('show');
  }

  if (reduceMotion) {
    window.addEventListener('load', revealInstantly);
    return;
  }

  var wordIndex = 0;
  var charIndex = 0;

  function placeCursor(rowId) {
    cursorEl.classList.add('on');
    document.getElementById(rowId).appendChild(cursorEl);
  }

  function typeStep() {
    if (wordIndex >= words.length) {
      finish();
      return;
    }

    var rowId = 'row-' + wordIndex;
    var word = words[wordIndex];

    if (charIndex === 0) placeCursor(rowId);

    if (charIndex < word.length) {
      document.getElementById('text-' + wordIndex).textContent += word[charIndex];
      charIndex++;
      setTimeout(typeStep, typingSpeed);
    } else {
      wordIndex++;
      charIndex = 0;
      setTimeout(typeStep, linePause);
    }
  }

  function finish() {
    setTimeout(function () {
      cursorEl.classList.add('done');
      dividerEl.classList.add('show');
      setTimeout(function () {
        statusEl.classList.add('show');
      }, 300);
    }, 220);
  }

  window.addEventListener('load', function () {
    setTimeout(typeStep, startDelay);
  });
})();
</script>

</body>
</html>
